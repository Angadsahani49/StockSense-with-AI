name: Deploy StockSense AI to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      # Step A: Deploy to gh-pages branch (Universally works even if Pages is on default settings)
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      # Step B: Native GitHub Actions Pages deployment (Active when Source is set to GitHub Actions)
      - name: Setup GitHub Pages
        id: pages_setup
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        if: steps.pages_setup.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages Native
        if: steps.pages_setup.outcome == 'success'
        continue-on-error: true
        id: deployment
        uses: actions/deploy-pages@v4
